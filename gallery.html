  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand" aria-label="DentWide 치과기공소 홈">

        <span class="brand-name">DentWide <span>치과기공소</span></span>

      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav">

  <main id="main">
    <header class="page-head">
      <div class="wrap">
        <div class="swatch-line" aria-hidden="true"></div>
        <h1>제작 사례</h1>
        <p class="lead">최근 출고한 케이스를 품목별로 모았습니다. 사례를 누르면 치식, 재료, 작업 메모를 보실 수 있습니다.</p>
      </div>
    </header>

    <section class="band gallery-band" aria-label="제작 사례 목록">
      <div class="wrap">
        <div class="filters" role="group" aria-label="품목별 보기">
          <button type="button" class="filter" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="filter" data-filter="zirconia" aria-pressed="false">지르코니아</button>
          <button type="button" class="filter" data-filter="implant" aria-pressed="false">임플란트</button>
          <button type="button" class="filter" data-filter="bridge" aria-pressed="false">브릿지</button>
          <button type="button" class="filter" data-filter="laminate" aria-pressed="false">라미네이트</button>
        </div>
        <p class="count muted" id="case-count" aria-live="polite">12건</p>

        <ul class="sheet" id="sheet">
        <li class="case" data-cat="zirconia">
          <button type="button" class="case-btn" data-tooth="#11" data-cat-label="지르코니아" data-code="A1" data-material="고투명 멀티레이어 지르코니아" data-memo="절단 1/3 투명도를 인접치에 맞춰 스테인 조정" data-sym="crown" style="--shade:#F0E5CB">
            <span class="case-field"><span class="case-tooth">#11</span><span class="case-code">A1</span><svg class="case-sym" aria-hidden="true"><use href="#sym-crown"></use></svg></span>
            <span class="case-title">상악 중절치 풀 지르코니아 크라운</span>
            <span class="case-meta"><span>지르코니아</span><span>쉐이드 A1</span></span>
          </button>
        </li>
        <li class="case" data-cat="implant">
          <button type="button" class="case-btn" data-tooth="#36" data-cat-label="임플란트" data-code="A3" data-material="지르코니아 + Ti-base" data-memo="스크류 홀 위치를 교합면 중앙 소와로 설계" data-sym="implant" style="--shade:#E0C697">
            <span class="case-field"><span class="case-tooth">#36</span><span class="case-code">A3</span><svg class="case-sym" aria-hidden="true"><use href="#sym-implant"></use></svg></span>
            <span class="case-title">하악 제1대구치 스크류 리테인 크라운</span>
            <span class="case-meta"><span>임플란트</span><span>쉐이드 A3</span></span>
          </button>
        </li>
        <li class="case" data-cat="bridge">
          <button type="button" class="case-btn" data-tooth="#14–16" data-cat-label="브릿지" data-code="A3" data-material="풀 지르코니아" data-memo="연결부 단면적 9mm² 이상 확보" data-sym="bridge" style="--shade:#E0C697">
            <span class="case-field"><span class="case-tooth">#14–16</span><span class="case-code">A3</span><svg class="case-sym" aria-hidden="true"><use href="#sym-bridge"></use></svg></span>
            <span class="case-title">상악 소구치부 3유닛 브릿지</span>
            <span class="case-meta"><span>브릿지</span><span>쉐이드 A3</span></span>
          </button>
        </li>
        <li class="case" data-cat="laminate">
          <button type="button" class="case-btn" data-tooth="#11, #21" data-cat-label="라미네이트" data-code="B1" data-material="e.max 프레스" data-memo="0.5mm 두께, 법랑질 내 마진" data-sym="laminate" style="--shade:#F3EAD3">
            <span class="case-field"><span class="case-tooth">#11, #21</span><span class="case-code">B1</span><svg class="case-sym" aria-hidden="true"><use href="#sym-laminate"></use></svg></span>
            <span class="case-title">상악 중절치 라미네이트 2본</span>
            <span class="case-meta"><span>라미네이트</span><span>쉐이드 B1</span></span>
          </button>
        </li>
        <li class="case" data-cat="zirconia">
          <button type="button" class="case-btn" data-tooth="#46" data-cat-label="지르코니아" data-code="A3" data-material="고강도 지르코니아" data-memo="대합치 마모를 고려해 교합면 연마 마감" data-sym="crown" style="--shade:#E0C697">
            <span class="case-field"><span class="case-tooth">#46</span><span class="case-code">A3</span><svg class="case-sym" aria-hidden="true"><use href="#sym-crown"></use></svg></span>
            <span class="case-title">하악 제1대구치 풀 지르코니아 크라운</span>
            <span class="case-meta"><span>지르코니아</span><span>쉐이드 A3</span></span>
          </button>
        </li>
        <li class="case" data-cat="implant">
          <button type="button" class="case-btn" data-tooth="#46" data-cat-label="임플란트" data-code="A3.5" data-material="티타늄 커스텀 어버트먼트 + 지르코니아 크라운" data-memo="치은연하 0.5mm 마진, 에머전스 프로파일 조정" data-sym="implant" style="--shade:#D5B582">
            <span class="case-field"><span class="case-tooth">#46</span><span class="case-code">A3.5</span><svg class="case-sym" aria-hidden="true"><use href="#sym-implant"></use></svg></span>
            <span class="case-title">커스텀 어버트먼트와 크라운</span>
            <span class="case-meta"><span>임플란트</span><span>쉐이드 A3.5</span></span>
          </button>
        </li>
        <li class="case" data-cat="bridge">
          <button type="button" class="case-btn" data-tooth="#12–22" data-cat-label="브릿지" data-code="A2" data-material="레이어드 지르코니아" data-memo="폰틱 하방 오베이트 형태" data-sym="bridge" style="--shade:#E9D6AE">
            <span class="case-field"><span class="case-tooth">#12–22</span><span class="case-code">A2</span><svg class="case-sym" aria-hidden="true"><use href="#sym-bridge"></use></svg></span>
            <span class="case-title">상악 전치부 4유닛 브릿지</span>
            <span class="case-meta"><span>브릿지</span><span>쉐이드 A2</span></span>
          </button>
        </li>
        <li class="case" data-cat="laminate">
          <button type="button" class="case-btn" data-tooth="#13–23" data-cat-label="라미네이트" data-code="A1" data-material="피드스패틱 포세린" data-memo="왁스업 승인 후 제작" data-sym="laminate" style="--shade:#F0E5CB">
            <span class="case-field"><span class="case-tooth">#13–23</span><span class="case-code">A1</span><svg class="case-sym" aria-hidden="true"><use href="#sym-laminate"></use></svg></span>
            <span class="case-title">상악 전치부 라미네이트 6본</span>
            <span class="case-meta"><span>라미네이트</span><span>쉐이드 A1</span></span>
          </button>
        </li>
        <li class="case" data-cat="zirconia">
          <button type="button" class="case-btn" data-tooth="#21" data-cat-label="지르코니아" data-code="A2" data-material="지르코니아 코어 + 포세린 레이어링" data-memo="인접 #11 자연치 사진 기준 색 조정" data-sym="crown" style="--shade:#E9D6AE">
            <span class="case-field"><span class="case-tooth">#21</span><span class="case-code">A2</span><svg class="case-sym" aria-hidden="true"><use href="#sym-crown"></use></svg></span>
            <span class="case-title">상악 중절치 레이어드 지르코니아 크라운</span>
            <span class="case-meta"><span>지르코니아</span><span>쉐이드 A2</span></span>
          </button>
        </li>
        <li class="case" data-cat="implant">
          <button type="button" class="case-btn" data-tooth="#24" data-cat-label="임플란트" data-code="A2" data-material="지르코니아 + Ti-base" data-memo="협측 형태를 인접 #25와 맞춤" data-sym="implant" style="--shade:#E9D6AE">
            <span class="case-field"><span class="case-tooth">#24</span><span class="case-code">A2</span><svg class="case-sym" aria-hidden="true"><use href="#sym-implant"></use></svg></span>
            <span class="case-title">상악 제1소구치 임플란트 크라운</span>
            <span class="case-meta"><span>임플란트</span><span>쉐이드 A2</span></span>
          </button>
        </li>
        <li class="case" data-cat="bridge">
          <button type="button" class="case-btn" data-tooth="#35–37" data-cat-label="브릿지" data-code="C2" data-material="풀 지르코니아" data-memo="지대치 평행성 디지털 확인 후 디자인" data-sym="bridge" style="--shade:#D3C6A6">
            <span class="case-field"><span class="case-tooth">#35–37</span><span class="case-code">C2</span><svg class="case-sym" aria-hidden="true"><use href="#sym-bridge"></use></svg></span>
            <span class="case-title">하악 구치부 3유닛 브릿지</span>
            <span class="case-meta"><span>브릿지</span><span>쉐이드 C2</span></span>
          </button>
        </li>
        <li class="case" data-cat="laminate">
          <button type="button" class="case-btn" data-tooth="#12, #22" data-cat-label="라미네이트" data-code="B2" data-material="e.max 프레스" data-memo="왜소치 형태 수복" data-sym="laminate" style="--shade:#EBDBAE">
            <span class="case-field"><span class="case-tooth">#12, #22</span><span class="case-code">B2</span><svg class="case-sym" aria-hidden="true"><use href="#sym-laminate"></use></svg></span>
            <span class="case-title">상악 측절치 라미네이트 2본</span>
            <span class="case-meta"><span>라미네이트</span><span>쉐이드 B2</span></span>
          </button>
        </li>
        </ul>
        <p class="note">사례 이미지는 실제 촬영 사진으로 교체되는 자리입니다.</p>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-labelledby="lb-title">
    <div class="lb-inner">
      <div class="lb-field" id="lb-field">
        <span class="case-tooth" id="lb-tooth"></span>
        <span class="case-code" id="lb-code"></span>
        <svg class="case-sym" aria-hidden="true"><use id="lb-use" href="#sym-crown"></use></svg>
      </div>
      <div class="lb-body">
        <h2 id="lb-title"></h2>
        <dl class="lb-data">
          <div><dt>치식</dt><dd id="lb-d-tooth"></dd></div>
          <div><dt>품목</dt><dd id="lb-d-cat"></dd></div>
          <div><dt>재료</dt><dd id="lb-d-mat"></dd></div>
          <div><dt>쉐이드</dt><dd id="lb-d-code"></dd></div>
          <div><dt>작업 메모</dt><dd id="lb-d-memo"></dd></div>
        </dl>
        <button type="button" class="btn btn-line lb-close" id="lb-close">닫기</button>
      </div>
    </div>
  </dialog>

      </div>
      <div class="footer-meta">

        <p>© DentWide 치과기공소</p>
      </div>
    </div>
  </footer>
